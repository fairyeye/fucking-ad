name: 🔄 Scheduled Build & Sync

on:
  schedule:
    # 每天 UTC 00:00 (北京时间 08:00) 定时执行自动构建
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub Actions 控制台手动一键点击触发
  push:
    branches: [ main ]
    paths:
      - 'data/records/**'

permissions:
  contents: write

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Lint records
        run: |
          python scripts/lint_data.py

      - name: Rebuild README.md and Web Portal (docs/)
        run: |
          python scripts/build_readme.py
          python scripts/build_site.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check git status
          if [ -n "$(git status --porcelain)" ]; then
            echo "发现有未同步的文件，准备自动提交..."
            git add README.md docs/
            git commit -m "chore(auto): update README and docs static portal [skip ci]"
            git push origin main
            echo "✅ 自动构建并同步成功！"
          else
            echo "✅ 所有数据和网页均处于最新状态，无需提交。"
          fi
