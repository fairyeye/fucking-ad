name: 📢 10秒快速曝光流氓弹窗
description: 零门槛曝光！只需填品牌和截图，企业信息和分类由机器人自动补全
title: "【曝光】[品牌名称] 在 [宿主APP] 投放流氓弹窗"
labels: ["待审核", "广告曝光"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🔥 感谢你为天下手机用户发声！
        **只需 3 步极速提交：填品牌 ➡️ 填宿主APP ➡️ 粘贴截图**。企业母公司与分类将由 GitHub Actions 机器人智能补全。

  - type: input
    id: advertiser_name
    attributes:
      label: 🚫 作恶广告主/品牌名称（必填）
      description: 弹窗宣传的具体品牌或产品是什么？
      placeholder: 如：拼多多、快手极速版、360借条、得物、瓜子二手车
    validations:
      required: true

  - type: input
    id: host_app
    attributes:
      label: 📲 受害宿主 APP 及平台（必填）
      description: 哪个 APP 弹出了该广告？运行在什么系统？
      placeholder: 如：酷狗音乐 (iOS) 或 墨迹天气 (Android)
    validations:
      required: true

  - type: checkboxes
    id: offense_type
    attributes:
      label: 🦹 作恶流氓手法（多选）
      options:
        - label: 摇一摇跳转（稍微手抖或走路就强行跳转）
          checked: true
        - label: 假关闭按钮/像素级诱导（X图标点不到或点了直接下载/打开）
        - label: 扭一扭/倾斜手机跳转
        - label: 伪装系统通知/微信红包/到账提醒（欺骗性视觉）
        - label: 开屏广告/全屏强制遮罩
        - label: 无法关闭/强制倒计时
        - label: 自动下载/静默安装
        - label: 应用内悬浮窗/流氓牛皮癣
        - label: 恐吓欺诈/假冒杀毒清理

  - type: textarea
    id: evidence
    attributes:
      label: 📷 证据截图与简述（必填）
      description: 截图直接在此处【粘贴】或【拖拽】即可上传！附上一两句简述（如：走路轻微晃动手腕即强行跳转）。
      placeholder: 直接 Ctrl+V 粘贴截图，并简单描述经过...
    validations:
      required: true

  - type: dropdown
    id: boycott_level
    attributes:
      label: 🛑 建议抵制程度 (默认5星终身拉黑)
      options:
        - "5 - ⭐⭐⭐⭐⭐ (终身拉黑/坚决不买)"
        - "4 - ⭐⭐⭐⭐☆ (极度恶劣)"
        - "3 - ⭐⭐⭐☆☆ (严重流氓)"
        - "2 - ⭐⭐☆☆☆ (中度反感)"
        - "1 - ⭐☆☆☆☆ (轻度骚扰)"
    validations:
      required: false

  - type: input
    id: parent_company
    attributes:
      label: 🏢 广告主母公司（选填，机器人可自动补全）
      description: 如不清楚可留空，机器人会自动匹配
      placeholder: 留空即可，机器人会自动补全
    validations:
      required: false

  - type: input
    id: host_alternatives
    attributes:
      label: 💡 推荐良心替代品（选填）
      description: 有没有能够替代该宿主APP的干净、开源好软件？
      placeholder: 如：椒盐音乐、几何天气、开源日历
    validations:
      required: false
