name: 📢 举报流氓弹窗广告
description: 提交一个新的流氓弹窗、摇一摇误触或诱导点击案例
title: "【曝光】[品牌名称] 在 [宿主APP] 投放流氓弹窗广告"
labels: ["待审核", "广告曝光"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛡️ 感谢你为天下手机用户发声！
        **无截图无真相，截图是立案铁证**。提交后 GitHub Actions 机器人将自动提取版本与时间，生成数据并同步更新至 [在线避雷检索站](https://fairyeye.github.io/fucking-ad/)。

  - type: input
    id: advertiser_name
    attributes:
      label: 🚫 作恶广告主 / 品牌名称
      description: 弹窗宣传的具体品牌或产品是什么？（例如：拼多多、某某分期、某某二手车）
      placeholder: 如：拼多多
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ 广告业务品类
      description: 选择该广告所属的行业品类
      options:
        - 电商购物
        - 金融借贷
        - 社交娱乐
        - 网络游戏
        - 二手车/房产
        - 生活服务
        - 工具清理
        - 在线教育/培训
        - 医疗健康/保健
        - 其他
    validations:
      required: true

  - type: input
    id: host_app
    attributes:
      label: 📲 受害宿主 APP 及平台
      description: 哪个 APP 弹出了该广告？运行在什么系统？
      placeholder: 如：酷狗音乐 (iOS) 或 万年历 (Android)
    validations:
      required: true

  - type: input
    id: host_version
    attributes:
      label: 🔢 宿主 APP 版本号（精准定责凭据）
      description: 请查看该 APP 的「我的/设置 -> 关于」中的具体版本号（如：v12.0.1）
      placeholder: 如：12.0.1 或 8.9.30
    validations:
      required: false

  - type: input
    id: incident_date
    attributes:
      label: 📅 事发捕获日期（时间存据）
      description: 发生该流氓弹窗的具体日期（格式 YYYY-MM-DD，留空则默认今天）
      placeholder: 如：2026-09-17（留空自动使用今天）
    validations:
      required: false

  - type: checkboxes
    id: offense_type
    attributes:
      label: 🦹 作恶流氓手法（多选）
      options:
        - label: 摇一摇跳转（稍微手抖或走路就强行唤醒）
        - label: 假关闭按钮/像素级诱导（X图标点不到或点了直接下载/打开）
        - label: 扭一扭/倾斜手机跳转
        - label: 伪装系统通知/微信红包/到账提醒（欺骗性视觉）
        - label: 开屏广告/全屏强制遮罩
        - label: 无法关闭/强制倒计时
        - label: 自动下载/静默安装
        - label: 应用内悬浮窗/流氓牛皮癣
        - label: 恐吓欺诈/假冒杀毒清理
        - label: 诱导付费/隐蔽扣费
        - label: 其他恶劣行为

  - type: dropdown
    id: boycott_level
    attributes:
      label: 🛑 建议抵制程度 (1-5 星)
      options:
        - "5 - ⭐⭐⭐⭐⭐ (终身拉黑/坚决不买)"
        - "4 - ⭐⭐⭐⭐☆ (极度恶劣)"
        - "3 - ⭐⭐⭐☆☆ (严重流氓)"
        - "2 - ⭐⭐☆☆☆ (中度反感)"
        - "1 - ⭐☆☆☆☆ (轻度骚扰)"
    validations:
      required: true

  - type: textarea
    id: description_and_evidence
    attributes:
      label: 📷 恶行截图（铁证 · 必填）与事发说明
      description: 必须附上截图铁证！请直接在此处【Ctrl+V 粘贴】或【拖拽】上传屏幕截图（无图不予收录），并简单说明事发过程。
      placeholder: 必须直接在此处粘贴或拖入屏幕截图证据！并简单说明事发过程（如：走路手腕微晃直接唤醒跳转，关闭按键延迟3秒才显示）...
    validations:
      required: true

  - type: input
    id: host_alternatives
    attributes:
      label: 💡 推荐良心替代品（选填）
      description: 有没有能够替代该宿主 APP 的干净、开源好软件推荐？
      placeholder: 如：椒盐音乐、几何天气、开源日历 Simple Calendar
    validations:
      required: false
