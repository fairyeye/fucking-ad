name: 📢 举报流氓弹窗广告
description: 提交一个新的流氓弹窗、摇一摇误触或诱导点击案例
title: "【曝光】[品牌名称] 在 [宿主APP] 投放流氓弹窗广告"
labels: ["待审核", "广告曝光"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🛡️ 感谢你为天下手机用户发声！
        互联网没有记忆，但 Git 有。请提供真实截图凭据，提交后 GitHub Actions 机器人将自动解析并创建合并请求（PR），同步上线至 [在线避雷检索站](https://fairyeye.github.io/fucking-ad/)。

  - type: input
    id: advertiser_name
    attributes:
      label: 🚫 作恶广告主 / 品牌名称
      description: 弹窗宣传的具体品牌或产品是什么？（例如：拼多多、某某分期、某某二手车）
      placeholder: 如：拼多多
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ 广告业务品类
      description: 选择该广告所属的行业品类
      options:
        - 电商购物
        - 金融借贷
        - 社交娱乐
        - 网络游戏
        - 二手车/房产
        - 生活服务
        - 工具清理
        - 在线教育/培训
        - 医疗健康/保健
        - 其他
    validations:
      required: true

  - type: input
    id: host_app
    attributes:
      label: 📲 受害宿主 APP 及平台
      description: 哪个 APP 弹出了该广告？运行在什么系统？
      placeholder: 如：酷狗音乐 (iOS) 或 万年历 (Android)
    validations:
      required: true

  - type: checkboxes
    id: offense_type
    attributes:
      label: 🦹 作恶流氓手法（多选）
      options:
        - label: 摇一摇跳转（稍微手抖或走路就强行唤醒）
        - label: 假关闭按钮/像素级诱导（X图标点不到或点了直接下载/打开）
        - label: 扭一扭/倾斜手机跳转
        - label: 伪装系统通知/微信红包/到账提醒（欺骗性视觉）
        - label: 开屏广告/全屏强制遮罩
        - label: 无法关闭/强制倒计时
        - label: 自动下载/静默安装
        - label: 应用内悬浮窗/流氓牛皮癣
        - label: 恐吓欺诈/假冒杀毒清理
        - label: 诱导付费/隐蔽扣费
        - label: 其他恶劣行为

  - type: dropdown
    id: boycott_level
    attributes:
      label: 🛑 建议抵制程度 (1-5 星)
      options:
        - "5 - ⭐⭐⭐⭐⭐ (终身拉黑/坚决不买)"
        - "4 - ⭐⭐⭐⭐☆ (极度恶劣)"
        - "3 - ⭐⭐⭐☆☆ (严重流氓)"
        - "2 - ⭐⭐☆☆☆ (中度反感)"
        - "1 - ⭐☆☆☆☆ (轻度骚扰)"
    validations:
      required: true

  - type: textarea
    id: description_and_evidence
    attributes:
      label: 📷 恶行简述与截图凭证
      description: 请简单描述事发过程，并直接将截图【拖拽】或【Ctrl+V 粘贴】上传到此输入框（极其重要，无图不予收录）。
      placeholder: 走路手腕轻晃直接跳转唤醒；返回后关闭按键延迟3秒才显示... (在此处直接粘贴截图)
    validations:
      required: true

  - type: input
    id: host_alternatives
    attributes:
      label: 💡 推荐良心替代品（选填）
      description: 有没有能够替代该宿主 APP 的干净、开源好软件推荐？
      placeholder: 如：椒盐音乐、几何天气、开源日历 Simple Calendar
    validations:
      required: false
